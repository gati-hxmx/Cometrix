version: '3.9'

services:
  db:
    image: postgres:15
    container_name: cometrix-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net

  redis:
    image: redis:7
    container_name: cometrix-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - backend-net

volumes:
  postgres_data:

networks:
  backend-net:
